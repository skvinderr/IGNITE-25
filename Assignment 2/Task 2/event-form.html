<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeFest 2025 Registration</title>
   <link rel="stylesheet" href="event-form.css">
</head>
<body>
  <div class="container">
  <div class="form-container">
    <h2>College Coding Event Registration</h2>
    <div class="event-details">
      <p><strong>Event:</strong> CodeFest 2025</p>
      <p><strong>Date:</strong> July 15, 2025</p>
      <p><strong>Time:</strong> 9:00 AM – 5:00 PM</p>
      <p><strong>Venue:</strong> Computer Science Building, Room 101</p>
    </div>

    <form>
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

      <label for="college">College/University</label>
      <input type="text" id="college" name="college" placeholder="Enter college name">

      <label for="year">Year of Study *</label>
      <select id="year" name="year" required>
        <option value="">-- Select Year --</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>

      <label>Programming Experience *</label>
      <div class="radio-group">
        <label><input type="radio" name="experience" value="beginner" required> Beginner</label>
        <label><input type="radio" name="experience" value="intermediate"> Intermediate</label>
        <label><input type="radio" name="experience" value="advanced"> Advanced</label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
  </div>
</body>
</html>
